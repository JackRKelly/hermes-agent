name: Native protected tool source slice

on:
  push:
    branches: [feat/native-protected-adapter]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel-source:
    name: Sentinel-only (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          extras: '[]'
          test-environment: 'true'
          archive-inputs: 'false'
          cache: 'false'
          cache-python: 'false'
      - name: Source checks
        run: '"$HERMES_PYTHON" scripts/check --commit "$GITHUB_SHA" --base 75d15c1a53d74ecce6f3cc094cb0bd9bf4238fb4'
      - name: Actual native seam and regression fixtures (no provider)
        env:
          HOME: ${{ runner.temp }}/sentinel-home
          HERMES_HOME: ${{ runner.temp }}/sentinel-home/hermes
          TMPDIR: ${{ runner.temp }}
          HERMES_TEST_FILE_RETRIES: '0'
        run: |
          mkdir -p "$HOME" "$HERMES_HOME"
          scripts/run_tests.sh tests/gateway/test_protected_tool_adapter.py tests/gateway/test_managed_spawn_cancellation.py tests/gateway/test_managed_worker_group_close.py tests/tools/test_file_operations.py
