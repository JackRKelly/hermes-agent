name: Windows contract diagnostic

on:
  push:
    branches: [ci/windows-contract-probe-20261028]

permissions:
  contents: read

jobs:
  isolated-case-control:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out the exact failing source, not the probe controller
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a
        with:
          ref: c733af920b0a40bfdbc73c454e275657ebdb5270

      - name: Set up the same locked test environment
        uses: ./.github/actions/setup-pm
        with:
          packages: git,ripgrep
          extras: '["all", "telegram", "anthropic", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Verify source and native host
        id: source_check
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = c733af920b0a40bfdbc73c454e275657ebdb5270
          python -c "import os,platform; assert platform.system() == 'Windows'; print({'os':platform.system(),'arch':platform.machine(),'cpu_count':os.cpu_count()})"

      - name: Observe Git layout without changing Git or its configuration
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil, subprocess
          from pathlib import Path
          from hermes_cli import update_cmd_git as git_update
          selected = shutil.which('git')
          print(json.dumps({'selected_git': selected, 'locator_result': str(git_update._locate_real_git())}))
          roots = [Path(r'C:\Program Files\Git'), Path(r'C:\Program Files (x86)\Git')]
          if selected:
              roots.append(Path(selected).parent.parent)
          seen = set()
          for root in roots:
              if not root.is_dir():
                  continue
              for executable in root.rglob('git.exe'):
                  if executable in seen:
                      continue
                  seen.add(executable)
                  result = {'path': str(executable), 'size': executable.stat().st_size}
                  try:
                      version = subprocess.run([str(executable), '--version'], capture_output=True, text=True, timeout=15)
                      result.update(exit=version.returncode, stdout=version.stdout.strip(), stderr=version.stderr.strip())
                  except subprocess.TimeoutExpired:
                      result['probe'] = '15-second diagnostic observation expired'
                  print(json.dumps(result))
          PY

      - name: Run Git locator, command and all five native live tests
        if: always() && steps.source_check.outcome == 'success'
        shell: bash
        run: |
          scripts/run_tests.sh -j 2 --file-retries 0 \
            tests/hermes_cli/test_git_trampoline_locator.py \
            tests/hermes_cli/test_cmd_update.py \
            tests/hermes_cli/test_git_trampoline_windows_live.py \
            -- -vv --tb=long
        env:
          HERMES_TEST_WORKERS: '2'
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''

      - name: Verify native Git console-hide compatibility
        if: always() && steps.source_check.outcome == 'success'
        shell: bash
        run: |
          scripts/run_tests.sh -j 1 --file-retries 0 \
            tests/test_windows_subprocess_no_window_flags.py \
            -- -k test_update_git_plumbing_spawns_hide_console_window -vv --tb=long
        env:
          HERMES_TEST_WORKERS: '1'
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''

      - name: Verify no source files were changed
        if: always() && steps.source_check.outcome == 'success'
        shell: bash
        run: git diff --exit-code
