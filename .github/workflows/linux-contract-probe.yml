name: Linux contract diagnostic

on:
  push:
    branches: [ci/linux-contract-probe-20261028]

permissions:
  contents: read

jobs:
  lower-concurrency-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out unchanged failing subject
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a
        with:
          ref: 9137390617a558f548255b26c9faf588e77aad3f
          persist-credentials: false

      - name: Install the original Linux lane's pinned ripgrep
        shell: bash
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Set up the same locked Python test environment
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          prune-python-cache: true
          save-tools-cache: false
          save-python-cache: false
          save-node-cache: false

      - name: Verify exact source and native host
        id: source_check
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 9137390617a558f548255b26c9faf588e77aad3f
          "$HERMES_PYTHON" - <<'PY'
          import json, os, platform, sqlite3, sys
          import hermes_state_wal as wal
          assert platform.system() == 'Linux'
          assert sys.version_info[:3] == (3, 14, 9)
          assert not wal.is_sqlite_wal_reset_vulnerable()
          print(json.dumps({'os': platform.system(), 'arch': platform.machine(), 'cpus': os.cpu_count(), 'python': sys.version, 'sqlite': sqlite3.sqlite_version}))
          PY

      - name: Run failing regression files with two workers and no retries
        if: steps.source_check.outcome == 'success'
        shell: bash
        run: |
          scripts/run_tests.sh -j 2 --file-retries 0 --fail-on-skip \
            tests/agent/test_prepared_compaction.py \
            tests/agent/test_subagent_lifecycle.py \
            tests/gateway/test_managed_worker_hooks.py \
            tests/gateway/test_cli_plugin_command_in_gateway.py \
            tests/gateway/test_native_http_auth.py \
            tests/gateway/test_worker_persistence.py \
            -- -vv -rs --tb=long -o faulthandler_timeout=60
        env:
          HERMES_TEST_WORKERS: '2'
          HERMES_TEST_FILE_TIMEOUT: '600'
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''

      - name: Verify original source remains unchanged
        if: always() && steps.source_check.outcome == 'success'
        shell: bash
        run: git diff --exit-code HEAD --
